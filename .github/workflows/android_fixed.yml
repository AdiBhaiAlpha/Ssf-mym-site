name: Build Android App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build React + Capacitor Android
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Set up JDK 22
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '22'
        cache: 'gradle'

    - name: Install Dependencies
      run: npm ci

    - name: Build Web Application
      run: npm run build

    - name: Synchronize Capacitor Project
      run: npx cap sync android

    - name: Validate and Repair PNG Assets
      run: |
        echo "Checking PNG assets..."
        python3 - <<'PY'
        import glob
        bad=[]
        for p in glob.glob('android/app/src/main/res/**/*.png', recursive=True):
            with open(p,'rb') as f:
                if f.read(4)!=b'\x89PNG':
                    bad.append(p)
        if bad:
            print("Corrupted PNG files:")
            [print(x) for x in bad]
            raise SystemExit(1)
        print("SUCCESS: All PNG assets are valid.")
        PY


    - name: Make Gradle Wrapper Executable
      run: chmod +x android/gradlew
      working-directory: .

    - name: Build Android Debug APK
      run: ./gradlew assembleDebug
      working-directory: android

    - name: Build Android Release APK
      run: ./gradlew assembleRelease
      working-directory: android

    - name: Build Android Release AAB
      run: ./gradlew bundleRelease
      working-directory: android

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: android/app/build/outputs/apk/debug/*.apk

    - name: Upload Release APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: android/app/build/outputs/apk/release/*.apk

    - name: Upload Release AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-aab
        path: android/app/build/outputs/bundle/release/*.aab
